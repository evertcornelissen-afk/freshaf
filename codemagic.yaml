# FreshAF iOS build: a cloud Mac builds the app and uploads it to TestFlight.
# Apple only lets iOS apps be built on a Mac; this is the Mac. Setup, once, is in
# APP-STORE-SUBMISSION.md section B2.
#
# Runs only when started by hand from the Codemagic dashboard (Start new build), so a
# push to master never ships an app build by accident.
workflows:
  ios-testflight:
    name: FreshAF iOS -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Created in Codemagic > Team settings > Integrations > Developer Portal, from an
      # App Store Connect API key. Must have exactly this name.
      app_store_connect: FreshAF App Store Connect
    environment:
      ios_signing:
        # Codemagic creates and renews the distribution certificate and provisioning
        # profile itself, through the API key. No certificates to manage by hand.
        distribution_type: app_store
        bundle_identifier: io.freshaf.app
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Copy the app's screens and plugins into the iOS project
        script: npx cap sync ios
      - name: Apply signing
        script: xcode-project use-profiles
      - name: Set the build number
        # Every upload to Apple needs a higher build number than the last. Codemagic's own
        # run counter always increases, so it is used directly.
        script: |
          cd ios/App
          agvtool new-version -all "$((BUILD_NUMBER + 1))"
      - name: Build the signed app
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Lands in TestFlight for testing on real phones. Sending it to App Review is a
        # separate, deliberate click in App Store Connect.
        submit_to_testflight: true
