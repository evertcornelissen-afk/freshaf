# FreshAF app builds in the cloud. iOS: a cloud Mac builds the app and uploads it to
# TestFlight (Apple only lets iOS apps be built on a Mac). Android: a Linux machine builds the
# signed App Bundle for Google Play. Setup, once, is in APP-STORE-SUBMISSION.md B2 and A2b.
#
# Runs only when started by hand from the Codemagic dashboard (Start new build), so a
# push to master never ships an app build by accident.
workflows:
  ios-testflight:
    name: FreshAF iOS -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Created in Codemagic > Team settings > Integrations > Developer Portal, from an
      # App Store Connect API key. Must have exactly this name.
      app_store_connect: FreshAF App Store Connect
    environment:
      ios_signing:
        # Codemagic creates and renews the distribution certificate and provisioning
        # profile itself, through the API key. No certificates to manage by hand.
        distribution_type: app_store
        bundle_identifier: io.freshaf.app
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Copy the app's screens and plugins into the iOS project
        script: npx cap sync ios
      - name: Apply signing
        script: xcode-project use-profiles
      - name: Set the build number
        # Every upload to Apple needs a higher build number than the last. Codemagic's own
        # run counter always increases, so it is used directly.
        script: |
          cd ios/App
          agvtool new-version -all "$((BUILD_NUMBER + 1))"
      - name: Build the signed app
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Lands in TestFlight for testing on real phones. Sending it to App Review is a
        # separate, deliberate click in App Store Connect.
        submit_to_testflight: true

  # Android: builds a signed App Bundle (.aab) and puts it on Google Play's INTERNAL
  # testing track (up to 100 testers, no Google review). Promoting it to Production is a
  # separate, deliberate click in Play Console. Setup, once, is in APP-STORE-SUBMISSION.md A2b.
  android-play-internal:
    name: FreshAF Android -> Play internal testing
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      android_signing:
        # The upload key, uploaded once in Codemagic > Team settings > Code signing
        # identities > Android keystores, under exactly this reference name.
        - freshaf_upload_key
      groups:
        # GOOGLE_SERVICES_JSON (Firebase config, base64) and GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # (Play Console API service account JSON), set in Codemagic > Environment variables.
        - freshaf_android
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Firebase config for Android push
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON not set: the app builds, but Android push stays off"
          fi
      - name: Copy the app's screens and plugins into the Android project
        script: npx cap sync android
      - name: Build the signed App Bundle
        # build.gradle reads CM_KEYSTORE_* (set by android_signing) and BUILD_NUMBER.
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # The first upload of a new app must be done by hand in Play Console; Google's API
        # refuses until the app exists there. After that, this publishes on its own.
        submit_as_draft: false
