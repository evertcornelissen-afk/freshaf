# Render.com blueprint — creates the FreshAF web service with a persistent disk
# for the SQLite database. Connect this repo in Render and it auto-detects this file.
services:
  - type: web
    name: freshaf
    runtime: node
    plan: starter # needed for the persistent disk; free tier loses the database on restart
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/pricing
    disk:
      name: freshaf-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5757"
      - key: BASE_URL
        sync: false # set to the public URL Render assigns (or your custom domain)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false # set a strong one BEFORE first boot — the admin account is seeded once
      # Stitch Express. Card stays off until PAYMENTS_LIVE is literally "true" AND the
      # client id and secret are present, so these being set is not enough to charge
      # anyone by accident.
      - key: PAYMENT_PROVIDER
        value: stitch
      - key: STITCH_CLIENT_ID
        sync: false
      - key: STITCH_CLIENT_SECRET
        sync: false # regenerated whenever someone views it in the Stitch dashboard
      - key: STITCH_WEBHOOK_SECRET
        sync: false
      - key: PAYMENTS_LIVE
        sync: false
      # Optional. Without it, address search falls back to OpenStreetMap and the callout
      # fee falls back to straight-line distance.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # Encrypts supplier ID numbers and bank details at rest. Without it they
      # are plain text in the database and in every backup.
      - key: DATA_KEY
        sync: false
      # Required by every admin API call, on top of the admin login.
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
