<!doctype html><html><head><meta charset="utf-8"><title>FreshAF icons — drawn, not generated</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#10424f;--cyan:#25b8dd;--coral:#ff6b4a;--bg:#0a1217;--ink:#edf5f8;--muted:#9ab2bd}
body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;margin:0;padding:34px}
h1{font-size:1.2rem;margin:0 0 4px}
p{color:var(--muted);font-size:.85rem;margin:0 0 26px;max-width:70ch;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;max-width:900px}
.c{background:#101e26;border:1px solid #1d343e;border-radius:16px;padding:16px 10px;text-align:center}
.c svg{width:52px;height:52px;display:block;margin:0 auto 9px}
.c span{font-size:.68rem;color:var(--muted);font-weight:600}
</style></head><body>
<h1>Icons drawn as vectors, not generated</h1>
<p>Exact brand colours, sharp at every size, a few hundred bytes each, no watermark, no licensing question and no queue. Resize this window — they never blur.</p>
<div class="grid">

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<path d="M8 30h32M10 30l3-9a3 3 0 0 1 2.8-2h16.4a3 3 0 0 1 2.8 2l3 9" stroke="var(--cyan)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="7" y="30" width="34" height="7" rx="3" fill="var(--cyan)" opacity=".22"/>
<circle cx="15" cy="37" r="3.2" fill="var(--cyan)"/><circle cx="33" cy="37" r="3.2" fill="var(--cyan)"/>
<circle cx="15" cy="13" r="3" fill="var(--coral)"/><circle cx="24" cy="8" r="2.2" fill="var(--coral)" opacity=".75"/><circle cx="32" cy="12" r="1.7" fill="var(--coral)" opacity=".55"/>
</svg><span>Car wash</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<rect x="9" y="27" width="30" height="6" rx="3" fill="var(--cyan)"/>
<rect x="11" y="19" width="26" height="6" rx="3" fill="var(--cyan)" opacity=".65"/>
<rect x="13" y="11" width="22" height="6" rx="3" fill="var(--cyan)" opacity=".35"/>
<rect x="9" y="35" width="30" height="5" rx="2.5" fill="var(--navy)" stroke="var(--cyan)" stroke-width="1.6"/>
<circle cx="37" cy="10" r="3" fill="var(--coral)"/>
</svg><span>Laundry</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<path d="M8 31h32M11 31l3-9a3 3 0 0 1 2.8-2h14.4a3 3 0 0 1 2.8 2l3 9" stroke="var(--cyan)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="16" cy="37" r="3" fill="var(--cyan)"/><circle cx="32" cy="37" r="3" fill="var(--cyan)"/>
<path d="M36 10l1.6 4.4L42 16l-4.4 1.6L36 22l-1.6-4.4L30 16l4.4-1.6z" fill="var(--coral)"/>
</svg><span>Full valet</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<path d="M10 33V20a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v13" stroke="var(--cyan)" stroke-width="2.6" stroke-linecap="round"/>
<rect x="7" y="31" width="34" height="8" rx="4" fill="var(--cyan)" opacity=".3" stroke="var(--cyan)" stroke-width="1.6"/>
<path d="M17 16c0-3 14-3 14 0" stroke="var(--coral)" stroke-width="2.4" stroke-linecap="round"/>
</svg><span>Duvets</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<path d="M9 30h26a4 4 0 0 0 4-4v-1a5 5 0 0 0-5-5H18l-9 10z" fill="var(--cyan)" opacity=".28" stroke="var(--cyan)" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="9" y="33" width="30" height="4" rx="2" fill="var(--cyan)"/>
<path d="M30 14c0-2.4 3-2.4 3-4.8" stroke="var(--coral)" stroke-width="2.3" stroke-linecap="round"/>
<path d="M36 14c0-2.4 3-2.4 3-4.8" stroke="var(--coral)" stroke-width="2.3" stroke-linecap="round" opacity=".6"/>
</svg><span>Ironing</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<path d="M24 6l14 5v10c0 9-6 15.5-14 18-8-2.5-14-9-14-18V11z" fill="var(--coral)" opacity=".16" stroke="var(--coral)" stroke-width="2.4" stroke-linejoin="round"/>
<path d="M17 23.5l5 5 10-10.5" stroke="var(--coral)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg><span>Verified</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<path d="M24 6c6.6 0 12 5.2 12 11.6 0 8-12 24.4-12 24.4S12 25.6 12 17.6C12 11.2 17.4 6 24 6z" fill="var(--cyan)" opacity=".2" stroke="var(--cyan)" stroke-width="2.4" stroke-linejoin="round"/>
<path d="M19 20l5-4 5 4v6h-10z" fill="var(--cyan)"/>
</svg><span>Your address</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<rect x="6" y="11" width="24" height="17" rx="5" fill="var(--cyan)" opacity=".2" stroke="var(--cyan)" stroke-width="2.3"/>
<path d="M13 28l-1 6 7-6z" fill="var(--cyan)"/>
<rect x="24" y="21" width="18" height="13" rx="4" fill="var(--coral)" opacity=".2" stroke="var(--coral)" stroke-width="2.3"/>
<path d="M30 27.5h6M30 30.5h4" stroke="var(--coral)" stroke-width="2.2" stroke-linecap="round"/>
</svg><span>Get prices</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<path d="M9 36c7-1 9-14 17-15.5S36 16 39 12" stroke="var(--cyan)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="4 4.5"/>
<circle cx="9" cy="36" r="3.4" fill="var(--cyan)"/>
<path d="M39 6c3.3 0 6 2.6 6 5.8 0 4-6 12.2-6 12.2s-6-8.2-6-12.2C33 8.6 35.7 6 39 6z" fill="var(--coral)"/>
</svg><span>Track</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<rect x="6" y="14" width="36" height="21" rx="5" fill="var(--cyan)" opacity=".18" stroke="var(--cyan)" stroke-width="2.3"/>
<path d="M6 21h36" stroke="var(--cyan)" stroke-width="3"/>
<path d="M12 29h7" stroke="var(--cyan)" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="34" cy="29" r="3" fill="var(--coral)"/>
</svg><span>Card</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<rect x="6" y="15" width="29" height="18" rx="4" fill="var(--cyan)" opacity=".18" stroke="var(--cyan)" stroke-width="2.3"/>
<circle cx="20.5" cy="24" r="4.6" stroke="var(--cyan)" stroke-width="2.3"/>
<circle cx="37" cy="29" r="6" fill="var(--coral)" opacity=".25" stroke="var(--coral)" stroke-width="2.2"/>
<path d="M37 26v6M35.3 28h3.4" stroke="var(--coral)" stroke-width="2" stroke-linecap="round"/>
</svg><span>Cash</span></div>

<div class="c"><svg viewBox="0 0 48 48" fill="none">
<path d="M24 7l4.6 9.6 10.4 1.5-7.5 7.5 1.8 10.6L24 31.2 14.7 36.2l1.8-10.6L9 18.1l10.4-1.5z" fill="var(--coral)" opacity=".22" stroke="var(--coral)" stroke-width="2.4" stroke-linejoin="round"/>
</svg><span>Rewards</span></div>

</div></body></html>
