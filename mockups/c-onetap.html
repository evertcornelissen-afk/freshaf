<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreshAF — Direction C: One Tap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e3542;--muted:#67808b;--line:#e3eaee;--blue:#1799c2;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.shot{position:relative;height:218px;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,28,36,.55) 0%,rgba(6,28,36,0) 45%,rgba(255,255,255,.1) 85%,#fff 100%)}
.shot .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 18px}
.shot img.logo{height:18px;width:auto}
.ghost{border:1px solid rgba(255,255,255,.45);color:#fff;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border-radius:999px;padding:6px 14px;font:600 .76rem Inter}
.sheet{margin-top:-26px;position:relative;background:#fff;border-radius:26px 26px 0 0;padding:22px 20px 0}
h1{font-size:1.5rem;letter-spacing:-.025em;line-height:1.16;margin:0 0 6px;font-weight:800}
.sub{margin:0 0 18px;color:var(--muted);font-size:.9rem}
.field{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;margin-bottom:10px}
.field.focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,153,194,.1)}
.field i{font-style:normal;font-size:1rem}
.field input{border:0;outline:0;font:500 .95rem Inter;color:var(--ink);width:100%;background:none}
.field input::placeholder{color:#9fb0b8}
.seg{display:flex;gap:8px;margin:4px 0 16px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 8px;font:700 .84rem Inter;color:var(--muted)}
.seg button.on{border-color:var(--blue);background:#f2fafd;color:var(--ink)}
.quote{background:#f6f9fb;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.quote .row{display:flex;justify-content:space-between;align-items:baseline}
.quote .big{font-size:1.72rem;font-weight:800;letter-spacing:-.02em}
.quote .lbl{font-size:.74rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.quote p{margin:8px 0 0;font-size:.78rem;color:var(--muted);line-height:1.5}
.cta{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:15px;padding:17px;font:800 1rem Inter}
.meta{display:flex;gap:14px;justify-content:center;margin:14px 0 0;padding-bottom:26px}
.meta span{font-size:.74rem;color:var(--muted);font-weight:600}
.divider{height:1px;background:var(--line);margin:4px 0 18px}
</style></head><body>
<div class="shot">
  <img src="img/shine.jpg" alt="">
  <div class="grad"></div>
  <div class="top"><img class="logo" src="img/logo-dark.svg" alt="FreshAF"><button class="ghost">Sign in</button></div>
</div>

<div class="sheet">
  <h1>Where is it?</h1>
  <p class="sub">Give us the address and we'll price it instantly.</p>

  <div class="field focus"><i>📍</i><input placeholder="12 Durban Rd, Bellville" value="12 Durban Rd, Bellville"></div>
  <div class="field"><i>🚗</i><input placeholder="Add gate code, bay number, anything tricky"></div>

  <div class="seg"><button class="on">Car wash</button><button>Laundry</button></div>

  <div class="divider"></div>

  <div class="quote">
    <div class="row"><span class="lbl">Wash &amp; Vac · SUV</span><span class="big">R376</span></div>
    <p>All in. Travel included, nothing added at the door. 4 pros available near you, first one free in about 25 minutes.</p>
  </div>

  <button class="cta">Book it</button>
  <div class="meta"><span>★ 4.9 average</span><span>·</span><span>Cash or card</span><span>·</span><span>Vetted pros</span></div>
</div>
</body></html>
